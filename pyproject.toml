[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightspeed-agents"
version = "0.1.0"
description = "AI agent orchestration framework modeling a corporate organization as agents."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "openai>=1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "httpx>=0.26.0",
]
faiss = [
    "faiss-cpu>=1.7",
]
chroma = [
    "chromadb>=0.4",
]
vectorstore = [
    "faiss-cpu>=1.7",
    "chromadb>=0.4",
]

[project.scripts]
lightspeed = "lightspeed_agents.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
